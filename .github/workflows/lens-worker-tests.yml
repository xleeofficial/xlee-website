name: Lens Worker security tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/lens-worker-tests.yml"
  push:
    branches:
      - feature/xlee-lens-api
    paths:
      - "worker/**"
      - ".github/workflows/lens-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lens-worker-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Run tests
        working-directory: worker
        run: npm test
