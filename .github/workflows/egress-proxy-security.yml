name: Egress proxy SSRF security tests

on:
  push:
    branches: [feature/xlee-lens-api]
    paths:
      - "egress-proxy/**"
      - ".github/workflows/egress-proxy-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "egress-proxy/**"
      - ".github/workflows/egress-proxy-security.yml"

permissions:
  contents: read

jobs:
  security-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: egress-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts
      - run: node -e 'process.stdout.write("LOCKFILE_BASE64=" + require("node:fs").readFileSync("package-lock.json").toString("base64") + "\\n")'
      - run: npm ci --ignore-scripts
      - run: npm test
