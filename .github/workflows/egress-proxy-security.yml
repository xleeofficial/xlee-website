name: Egress proxy SSRF security tests

on:
  push:
    branches: [feature/xlee-lens-api]
    paths:
      - "egress-proxy/**"
      - ".github/workflows/egress-proxy-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "egress-proxy/**"
      - ".github/workflows/egress-proxy-security.yml"

permissions:
  contents: read

jobs:
  security-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: egress-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Run Worker security tests
        working-directory: worker
        run: npm test
      - name: Build container image without publishing
        run: docker build --tag xlee-lens-egress-proxy:test .
